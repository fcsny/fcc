name: 编译安卓 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 首次编译 Kivy 要交叉编译 Python 解释器和一堆 C 库，
    # 在 2 核 runner 上实测会超过 2 小时，120 分钟会被拦腰截断。
    # GitHub 免费账号单个 job 上限 6 小时，这里取 6 小时。
    timeout-minutes: 360
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 Android SDK（第二次起能省十几分钟）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-v1
          restore-keys: buildozer-sdk-${{ runner.os }}-

      - name: 释放磁盘空间
        run: |
          df -h
          # 删掉 runner 自带的 SDK 腾空间，但必须同时清掉指向它的环境变量——
          # 否则 buildozer 会按 ANDROID_HOME 去找一个已被删除的目录，5 分钟就崩
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          df -h

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-11-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          # setuptools 必须锁老版本：新版移除了 p4a 依赖的接口，会抛 Traceback
          # JDK 用 11：唯一一次深入编译（跑到 gcc 编译 C 文件）用的就是它
          pip install "setuptools==65.5.0" "wheel==0.38.4"
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: 编译 APK
        run: |
          # 超时保护：buildozer 失败后有时不退出，会一直挂到 job 超时
          # （实测过：5 分钟就报错，界面却转了 1.5 小时）
          timeout 3300 buildozer -v android debug
          code=$?
          if [ $code -eq 124 ]; then
            echo "编译超时（55 分钟），已中止"
          fi
          exit $code

      - name: 收集产物
        if: success()
        run: |
          mkdir -p apk_out
          find bin -name "*.apk" -exec cp {} apk_out/ \;
          ls -lh apk_out/

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aiwriter-apk-debug
          path: apk_out/*.apk
          retention-days: 30
          if-no-files-found: error
